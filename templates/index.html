
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>My Study Planner</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">

    <header>
        <h1>📚 My Study Planner</h1>
        <p>Stay organized, stay motivated!</p>
    </header>

    <div class="stats">
        <div class="stat">
            <h2 id="total">0</h2>
            <p>Total Tasks</p>
        </div>
        <div class="stat">
            <h2 id="completed">0</h2>
            <p>Completed</p>
        </div>
        <div class="stat">
            <h2 id="remaining">0</h2>
            <p>Remaining</p>
        </div>
    </div>

    <section class="card">
        <h2>📊 Your Study Progress</h2>
        <h3 id="progress-text">0% Completed</h3>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p>Keep going! You're doing great!</p>
    </section>

    <section class="card">
        <h2>📚 My Subjects</h2>
        <p>Add your own school subjects!</p>

        <form id="subject-form">
            <input type="text" id="subject-name"
                   placeholder="e.g. Kazakh, History"
                   maxlength="50" required>
            <button class="add-btn" type="submit">
                + Add Subject
            </button>
        </form>

        <div class="subject-list" id="subject-list"></div>
    </section>

    <section class="card">
        <h2>Add New Task</h2>

        <form id="task-form">
            <input type="text" id="task-title"
                   placeholder="What do you need to do?"
                   maxlength="150" required>

            <select id="task-subject" required></select>

            <input type="date" id="task-deadline">

            <button class="add-btn" type="submit">
                + Add Task
            </button>
        </form>
    </section>

    <section class="card">
        <h2>📝 My Tasks</h2>

        <div class="filters">
            <button class="filter-btn active"
                    data-filter="all">All Tasks</button>
            <button class="filter-btn"
                    data-filter="pending">Pending</button>
            <button class="filter-btn"
                    data-filter="completed">Completed</button>
        </div>

        <div id="task-list"></div>
    </section>

    <footer>
        Made with 💜 from IT-2602
    </footer>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
